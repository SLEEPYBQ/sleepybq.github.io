<div class="open-source">
  <p>I support open-source software and have contributed to the following projects:</p>
  <div class="oss-projects" aria-label="Open-source contributions">
    {% for project in site.data.open_source -%}
    <a class="oss-badge oss-badge--{{ project.id }}" href="https://github.com/{{ project.repo }}" target="_blank" rel="noopener" data-github-stars="{{ project.repo }}" aria-label="{{ project.name }} on GitHub">
      <span class="oss-project-name"><img class="oss-project-icon" src="{{ project.icon | relative_url }}" width="22" height="22" alt="">{{ project.name }}</span>
      <span class="pub-github-stars" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.78 5.63L21 9.54l-4.5 4.39 1.06 6.2L12 17.2l-5.56 2.93 1.06-6.2L3 9.54l6.22-.91Z"/></svg><span data-star-count></span></span>
    </a>
    {% endfor -%}
  </div>
</div>
